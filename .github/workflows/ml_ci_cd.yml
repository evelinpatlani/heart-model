name: Modelops deploy
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  repository_dispatch:
    types: [ml_ci_cd]
jobs:
  ml_ci_cd:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    env:
      TAG: ${{ github.event.client_payload.sha || github.sha }}
      IMAGE: ${{ secrets.DOCKER_USER }}/${{ secrets.MODEL_NAME }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: python version
      run: python --version
    - name: pip install
      run: pip install -r requirements.txt
    - name: download dataset
      if: github.event_name == 'repository_dispatch'
      env:
        DATASET_URL: ${{ github.event.client_payload.dataseturl }}
      run: |
        echo "Evento: ${{ github.event_name }}"
        echo "URL recibida: $DATASET_URL"
        test -n "$DATASET_URL" || { echo "ERROR: falta dataseturl en client_payload"; exit 1; }
        wget -O data/cars.csv "$DATASET_URL"
    - name: dataset info
      run: |
        head -3 data/cars.csv
        wc -l data/cars.csv
    - name: train model
      env:
        MODEL_TAG: ${{ env.TAG }}
      run: python model/train.py
    - name: docker build
      run: docker build -t "$IMAGE:$TAG" .
    - name: show images
      run: docker images
    - name: docker login
      env:
        DOCKER_USER: ${{ secrets.DOCKER_USER }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin
    - name: docker push
      run: docker push "$IMAGE:$TAG"
    - name: render deploy
      if: github.event_name == 'repository_dispatch'
      env:
        HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      run: |
        if [ -z "$HOOK" ]; then
          echo "Sin RENDER_DEPLOY_HOOK_URL: se omite el despliegue en Render"
          exit 0
        fi
        curl -fsS -G "$HOOK" --data-urlencode "imgURL=docker.io/$IMAGE:$TAG"